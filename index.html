*{box-sizing:border-box;margin:0;padding:0;-webkit-touch-callout:none}
html,body,#root{width:100%;height:100%;height:100dvh;
  background:radial-gradient(ellipse at top,#0d0d1c 0%,#07070e 60%,#040408 100%);
  overflow:hidden;
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;color:#dde1f0;font-size:14px;
  user-select:none;-webkit-user-select:none;touch-action:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(57,255,20,0.025) 1px,transparent 1px);
  background-size:20px 20px;mix-blend-mode:screen}
input,textarea{user-select:text;-webkit-user-select:text}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:#0a0a14}
::-webkit-scrollbar-thumb{background:#2a2a3a;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#39FF1444}
select option{background:#0c0c1a}
button{font-family:inherit;transition:all 0.15s ease;-webkit-appearance:none;appearance:none}
button:active:not(:disabled){transform:scale(0.96)}
input,select,textarea{-webkit-appearance:none;appearance:none;font-size:16px !important}
@media (hover:none) and (pointer:coarse){
  /* Touch devices: aumentar tamaños mínimos para iPad */
  button{min-height:32px}
  input,select{min-height:34px;font-size:16px !important}
  ::-webkit-scrollbar{width:8px;height:8px}
}
/* Prevenir el "rebote" de scroll en iOS */
html,body{overscroll-behavior:none;position:fixed;overflow:hidden;width:100%;height:100%;height:100dvh}
/* Safe area para iPads con notch/home indicator */
#root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
textarea{font-family:inherit;resize:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:200%}100%{background-position:-200%}}
@keyframes recpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.85)}}
@keyframes ghostFloat{0%,100%{filter:drop-shadow(0 8px 14px rgba(0,0,0,0.5))}50%{filter:drop-shadow(0 14px 22px rgba(0,0,0,0.65))}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(57,255,20,0.5)}100%{box-shadow:0 0 0 14px rgba(57,255,20,0)}}
@keyframes glowSlow{0%,100%{box-shadow:0 0 16px rgba(57,255,20,0.3)}50%{box-shadow:0 0 24px rgba(57,255,20,0.55)}}
@keyframes spinSlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.dbm-drag-ghost{position:fixed;pointer-events:none;z-index:9999;
  transform:translate(-50%,-120%);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  animation:ghostFloat 1.2s ease-in-out infinite;will-change:transform,left,top}
.dbm-ghost-circle{width:54px;height:54px;border-radius:50%;
  border:2.5px solid;display:flex;align-items:center;justify-content:center;
  font-family:'Courier New',monospace;font-weight:900;font-size:22px;color:white;
  box-shadow:0 0 0 4px rgba(57,255,20,0.25),0 8px 18px rgba(0,0,0,0.55),inset 0 -8px 14px rgba(0,0,0,0.35),inset 0 6px 10px rgba(255,255,255,0.18);
  position:relative;text-shadow:0 1px 2px rgba(0,0,0,0.5);overflow:hidden}
.dbm-ghost-photo{background-size:cover;background-position:center top}
.dbm-ghost-wrap{position:relative}
.dbm-ghost-badge{position:absolute;width:24px;height:24px;border-radius:50%;
  bottom:-3px;right:-3px;border:2px solid #07070e;
  display:flex;align-items:center;justify-content:center;
  font-family:'Courier New',monospace;font-weight:900;font-size:13px;color:white;
  box-shadow:0 2px 5px rgba(0,0,0,0.7);
  transform:translate(0,0);z-index:2}
.dbm-ghost-circle::after{content:'';position:absolute;inset:-7px;border-radius:50%;
  border:1.5px dashed #39FF14;animation:spinSlow 3s linear infinite}
.dbm-ghost-name{font-size:10px;font-weight:700;color:#dde1f0;
  background:rgba(7,7,14,0.92);padding:3px 8px;border-radius:4px;letter-spacing:0.5px;
  border:1px solid rgba(57,255,20,0.4);max-width:140px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,0.7);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.fade{animation:fadeIn .15s ease}
</style>

// ── PREVENCIÓN DE GESTOS iOS ──
(function() {
  // Prevenir gestos de zoom (pinch + double-tap)
  document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });
  // Prevenir double-tap zoom
  var lastTap = 0;
  document.addEventListener('touchend', function(e) {
    var now = Date.now();
    if (now - lastTap < 350) {
      // Permitir doble-tap solo en inputs/textarea/select
      var tag = e.target && e.target.tagName;
      if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
        e.preventDefault();
      }
    }
    lastTap = now;
  }, { passive: false });
})();

// ── DRAG GHOST GLOBAL (sigue el cursor al arrastrar desde banquillo) ──
window.dbmStartGhost = function(item, e) {
  var prev = document.querySelector('.dbm-drag-ghost');
  if (prev) prev.remove();
  var isRival = item.type === 'rival';
  var num = isRival ? item.data.squad_number : (item.data.player ? item.data.player.squad_number : item.data.squad_number);
  var name = isRival ? (item.data.name || '') : (item.data.player ? (item.data.player.name || '') : '');
  var photo = isRival ? null : (item.data.player ? (item.data.player.photo || null) : null);
  var color = isRival ? '#C62828' : '#1565C0';
  var rim = isRival ? '#FF5252' : '#42A5F5';
  var ghost = document.createElement('div');
  ghost.className = 'dbm-drag-ghost';
  var circleHtml;
  if (photo) {
    circleHtml = '<div class="dbm-ghost-wrap">' +
      '<div class="dbm-ghost-circle dbm-ghost-photo" style="background-image:url(' + photo + ');border-color:' + rim + '"></div>' +
      '<div class="dbm-ghost-badge" style="background:' + rim + '">' + num + '</div>' +
    '</div>';
  } else {
    circleHtml = '<div class="dbm-ghost-circle" style="background:' + color + ';border-color:' + rim + '"><span>' + num + '</span></div>';
  }
  ghost.innerHTML = circleHtml + (name ? '<div class="dbm-ghost-name">' + name + '</div>' : '');
  document.body.appendChild(ghost);
  function move(ev) {
    ghost.style.left = (ev.clientX) + 'px';
    ghost.style.top = (ev.clientY) + 'px';
  }
  function cleanup() {
    if (ghost && ghost.parentNode) ghost.remove();
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', cleanup);
    window.removeEventListener('pointercancel', cleanup);
  }
  move(e);
  ghost.style.transform = 'translate(-50%, -120%) scale(0.6)';
  ghost.style.opacity = '0';
  requestAnimationFrame(function() {
    ghost.style.transition = 'transform 0.18s cubic-bezier(0.34,1.56,0.64,1), opacity 0.15s';
    ghost.style.transform = 'translate(-50%, -120%) scale(1)';
    ghost.style.opacity = '1';
  });
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', cleanup);
  window.addEventListener('pointercancel', cleanup);
};

function defPos(n) {
  if ([1, 13, 25].includes(n)) return 'GK';
  if ([2, 3, 4, 5].includes(n)) return 'CB';
  if (n === 12) return 'LB';
  if (n === 16) return 'RB';

  if ([10, 20].includes(n)) return 'CAM';
  if ([11, 18].includes(n)) return 'LW';
  if ([7, 22].includes(n)) return 'RW';
  if ([9, 19, 24].includes(n)) return 'ST';
  return 'CM';
}

// Descargar un objeto como archivo JSON
function downloadJSON(obj, filename) {
  try {
    var json = JSON.stringify(obj, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
    localStorage.setItem(LAST_EXPORT_KEY, new Date().toISOString());
    return true;
  } catch (e) {
    alert('Error al descargar: ' + e.message);
    return false;
  }
}

// Leer archivo JSON desde input file
function readJSONFile(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function(e) {
      try { resolve(JSON.parse(e.target.result)); }
      catch (err) { reject(new Error('Archivo JSON inválido: ' + err.message)); }
    };
    reader.onerror = function() { reject(new Error('No se pudo leer el archivo')); };
    reader.readAsText(file);
  });
}

  // Restaurar/asegurar teams (si el equipo no existe, lo creamos)

  }
  if (data.away_team) {
    var existsAway = yield db.teams.get(data.away_team.id);
    if (!existsAway) yield db.teams.put(data.away_team);

  // Plays
  for (var p of (data.plays || [])) {
    yield db.plays.put(Object.assign({}, p, { id: playIdMap[p.id], match_id: newMatchId }));

  // Rival players
